
<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uji Sensor Komputer</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;color:#17202a;padding:16px}
main{max-width:680px;margin:auto;background:white;padding:20px;border-radius:14px}
button{width:100%;padding:14px;background:#1769aa;color:white;border:0;border-radius:9px;font-size:16px}
button:disabled{opacity:.6}
#status{background:#eef3f7;padding:12px;border-radius:8px;margin:16px 0;white-space:pre-wrap}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{text-align:left;padding:9px 5px;border-bottom:1px solid #ddd;font-size:12px}
.ok{color:#087443;font-weight:bold}
.warn{color:#a15c00;font-weight:bold}
.bad{color:#b42318;font-weight:bold}
small{display:block;color:#667085;margin-top:16px;line-height:1.5}
</style>
</head>
<body>
<main>
<h2>Uji Sensor Komputer</h2>
<p>Menguji sensor Nama Komputer, Pengguna, Serial, dan Model pada akses Publik dibandingkan dengan Admin.</p>

<button id="run">Mulai Uji Komputer</button>
<div id="status">Siap melakukan pengujian.</div>
<div id="result"></div>

<small>
Pengujian hanya membaca API. Tidak mengubah inventaris maupun Backend GAS.
Nilai asli perangkat tidak ditampilkan.
</small>
</main>

<script src="./api.js"></script>
<script>
const btn=document.getElementById("run");
const statusBox=document.getElementById("status");
const result=document.getElementById("result");

function getRows(data){
  let value=data;

  for(let i=0;i<4;i++){
    if(Array.isArray(value)) return value;

    if(value && Array.isArray(value.data)){
      value=value.data;
      continue;
    }

    if(value && Array.isArray(value.items)){
      value=value.items;
      continue;
    }

    break;
  }

  return [];
}

function isEmpty(value){
  return value===undefined ||
    value===null ||
    String(value).trim()==="";
}

function isMasked(value){
  return !isEmpty(value) && String(value).includes("*");
}

function compare(pub,admin,key){
  let same=0;
  let different=0;
  let empty=0;
  let publicMasked=0;
  let adminMasked=0;

  const total=Math.min(pub.length,admin.length);

  for(let i=0;i<total;i++){
    const a=pub[i]?.[key];
    const b=admin[i]?.[key];

    if(isEmpty(a)||isEmpty(b)){
      empty++;
      continue;
    }

    if(isMasked(a)) publicMasked++;
    if(isMasked(b)) adminMasked++;

    if(String(a)===String(b)){
      same++;
    }else{
      different++;
    }
  }

  return {
    same,
    different,
    empty,
    publicMasked,
    adminMasked
  };
}

btn.onclick=async()=>{
  btn.disabled=true;
  result.innerHTML="";
  statusBox.textContent="Memvalidasi sesi Admin...";

  try{
    if(!window.TechOpsAPI){
      throw Error("API tidak termuat.");
    }

    const valid=await TechOpsAPI.validateSession();

    if(valid!==true){
      throw Error("Sesi Admin tidak valid. Silakan login ulang.");
    }

    statusBox.textContent="Mengambil data Publik...";

    // Permintaan dilakukan berurutan agar hasil lebih mudah diperiksa.
    const publicData=await TechOpsAPI.getPublic(
      "computers.list",
      {includeArchived:false}
    );

    statusBox.textContent="Mengambil data Admin...";

    const adminData=await TechOpsAPI.get(
      "computers.list",
      {includeArchived:false}
    );

    const pub=getRows(publicData);
    const adm=getRows(adminData);

    if(!pub.length||!adm.length){
      throw Error("Data kosong atau format respons tidak dikenali.");
    }

    const total=Math.min(pub.length,adm.length);

    const fields=[
      ["Nama Komputer","komputer"],
      ["Pengguna","pengguna"],
      ["Serial","serial"],
      ["Model","model"]
    ];

    let html=
      "<p><b>Data Publik:</b> "+pub.length+
      "<br><b>Data Admin:</b> "+adm.length+
      "<br><b>Data dibandingkan:</b> "+total+"</p>";

    html+=`
      <table>
      <thead>
      <tr>
        <th>Kolom</th>
        <th>Publik disensor</th>
        <th>Admin disensor</th>
        <th>Berbeda</th>
      </tr>
      </thead>
      <tbody>
    `;

    let totalPublicMasked=0;
    let totalAdminMasked=0;

    fields.forEach(([label,key])=>{
      const r=compare(pub,adm,key);

      totalPublicMasked+=r.publicMasked;
      totalAdminMasked+=r.adminMasked;

      html+=`
        <tr>
          <td>${label}</td>
          <td>${r.publicMasked}</td>
          <td>${r.adminMasked}</td>
          <td>${r.different}</td>
        </tr>
      `;
    });

    html+="</tbody></table>";

    html+=`
      <p><b>Ringkasan sensor:</b></p>
      <p>Jumlah nilai tersensor pada Publik: <b>${totalPublicMasked}</b></p>
      <p>Jumlah nilai tersensor pada Admin: <b>${totalAdminMasked}</b></p>
    `;

    if(totalPublicMasked>0 && totalAdminMasked===0){
      html+=`<p class="ok">Akses Publik menunjukkan data tersensor dan Admin tidak menunjukkan tanda sensor.</p>`;
    }else if(totalAdminMasked>0){
      html+=`<p class="bad">PERLU DIPERIKSA: masih ditemukan tanda sensor pada respons Admin.</p>`;
    }else{
      html+=`<p class="warn">Belum ditemukan tanda sensor pada data Publik. Perlu pemeriksaan lebih lanjut.</p>`;
    }

    html+=`
      <p class="warn">
        Catatan: pengujian ini menghitung tanda sensor (*) dan perbedaan
        berdasarkan posisi baris. Hasil belum membuktikan seluruh aturan
        sensor sudah benar.
      </p>
    `;

    result.innerHTML=html;
    statusBox.textContent="Pengujian selesai.";

  }catch(e){
    statusBox.textContent="Uji gagal: "+(e.message||String(e));
  }finally{
    btn.disabled=false;
  }
};
</script>
</body>
</html>
