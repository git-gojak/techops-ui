
<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uji Sensor Komputer</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;color:#17202a;padding:16px}
main{max-width:680px;margin:auto;background:white;padding:20px;border-radius:14px}
button{width:100%;padding:14px;background:#1769aa;color:white;border:0;border-radius:9px;font-size:16px}
button:disabled{opacity:.6}
#status{background:#eef3f7;padding:12px;border-radius:8px;margin:16px 0;white-space:pre-wrap}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{text-align:left;padding:11px 7px;border-bottom:1px solid #ddd;font-size:13px}
.ok{color:#087443;font-weight:bold}
.warn{color:#a15c00;font-weight:bold}
small{display:block;color:#667085;margin-top:16px;line-height:1.5}
</style>
</head>
<body>
<main>
<h2>Uji Sensor Komputer</h2>
<p>Membandingkan Nama Komputer, Pengguna, dan Serial antara akses Publik dan Admin. Nilai asli tidak ditampilkan.</p>

<button id="run">Mulai Uji Komputer</button>
<div id="status">Siap melakukan pengujian.</div>
<div id="result"></div>

<small>Pengujian hanya membaca API. Tidak mengubah inventaris maupun Backend GAS.</small>
</main>

<script src="./api.js"></script>
<script>
const btn=document.getElementById("run");
const statusBox=document.getElementById("status");
const result=document.getElementById("result");

function getRows(data){
  if(Array.isArray(data)) return data;
  if(Array.isArray(data?.items)) return data.items;
  if(Array.isArray(data?.data)) return data.data;
  return [];
}

function compare(pub,admin,key){
  let same=0,different=0,empty=0;
  const total=Math.min(pub.length,admin.length);

  for(let i=0;i<total;i++){
    const a=pub[i]?.[key];
    const b=admin[i]?.[key];

    if(a===undefined||b===undefined||a===null||b===null||
       String(a)===""||String(b)===""){
      empty++;
    }else if(String(a)!==String(b)){
      different++;
    }else{
      same++;
    }
  }
  return {same,different,empty};
}

btn.onclick=async()=>{
  btn.disabled=true;
  result.innerHTML="";
  statusBox.textContent="Memvalidasi sesi Admin...";

  try{
    if(!window.TechOpsAPI) throw Error("API tidak termuat.");

    const valid=await TechOpsAPI.validateSession();
    if(valid!==true) throw Error("Sesi Admin tidak valid. Silakan login ulang.");

    statusBox.textContent="Mengambil data komputer Publik dan Admin...";

    const pair=await Promise.all([
      TechOpsAPI.getPublic("computers.list",{includeArchived:false}),
      TechOpsAPI.get("computers.list",{includeArchived:false})
    ]);

    const pub=getRows(pair[0]);
    const adm=getRows(pair[1]);

    if(!pub.length||!adm.length){
      throw Error("Data komputer kosong atau format respons tidak dikenali.");
    }

    const total=Math.min(pub.length,adm.length);
    const fields=[
      ["Nama Komputer","komputer","Berbeda"],
      ["Pengguna","pengguna","Sama"],
      ["Serial","serial","Berbeda"],
      ["Model","model","Sama"]
    ];

    let html="<p><b>Data Publik:</b> "+pub.length+
      "<br><b>Data Admin:</b> "+adm.length+
      "<br><b>Data dibandingkan:</b> "+total+"</p>";

    html+="<table><thead><tr><th>Kolom</th><th>Sama</th><th>Berbeda</th><th>Kosong</th></tr></thead><tbody>";

    fields.forEach(([label,key])=>{
      const r=compare(pub,adm,key);
      html+="<tr><td>"+label+"</td><td>"+r.same+
        "</td><td class='"+(r.different?"ok":"")+"'>"+r.different+
        "</td><td>"+r.empty+"</td></tr>";
    });

    html+="</tbody></table>";
    html+="<p class='ok'>Perbandingan selesai. Nilai asli tidak ditampilkan.</p>";

    result.innerHTML=html;
    statusBox.textContent="Berhasil mengambil dan membandingkan data komputer.";

  }catch(e){
    statusBox.textContent="Uji gagal: "+(e.message||String(e));
  }finally{
    btn.disabled=false;
  }
};
</script>
</body>
</html>
